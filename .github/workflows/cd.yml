name: CD

# Livraison continue :
# 1. après une CI réussie sur master (ou à la demande), l'image est publiée sur GHCR
#    avec les tags sha-<commit> et latest ;
# 2. si les secrets du serveur sont renseignés, elle est déployée par SSH avec
#    docker-compose.prod.yml puis vérifiée sur /up.
#
# Secrets (Settings > Secrets and variables > Actions), tous requis pour déployer :
#   DEPLOY_HOST         adresse du serveur
#   DEPLOY_USER         utilisateur SSH (membre du groupe docker)
#   DEPLOY_SSH_KEY      clé privée SSH (ed25519 conseillée)
#   DEPLOY_KNOWN_HOSTS  sortie de `ssh-keyscan -p <port> <hôte>` (empreinte vérifiée)
# Variables facultatives :
#   DEPLOY_PORT  port SSH (22)
#   DEPLOY_PATH  dossier de déploiement contenant .env.docker (~/patiserie-choukran)
#   DEPLOY_URL   URL publique de l'application, pour le contrôle de santé

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      deployer:
        description: Déployer sur le serveur après la publication de l'image
        type: boolean
        default: true

permissions:
  contents: read

# Jamais deux déploiements en parallèle ; un déploiement en cours n'est pas annulé.
concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  image:
    name: Image — publication sur GHCR
    runs-on: ubuntu-latest
    # CI réussie après un push sur master (pas une pull request), ou lancement manuel
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.nom.outputs.image }}
      tag: ${{ steps.nom.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Le commit validé par la CI, pas un éventuel commit plus récent de master
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Nom et tag de l'image
        id: nom
        run: |
          # GHCR n'accepte que des minuscules
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="sha-$(git rev-parse --short=7 HEAD)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Configurer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api/v1
          tags: |
            ${{ steps.nom.outputs.image }}:${{ steps.nom.outputs.tag }}
            ${{ steps.nom.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Déploiement SSH
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name != 'workflow_dispatch' || inputs.deployer
    environment: production
    permissions:
      contents: read
      packages: read

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/patiserie-choukran' }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
      APP_IMAGE: ${{ needs.image.outputs.image }}:${{ needs.image.outputs.tag }}

    steps:
      - name: Vérifier la configuration du serveur
        id: config
        run: |
          manquants=""
          for nom in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            [ -n "${!nom}" ] || manquants="$manquants $nom"
          done
          if [ -n "$manquants" ]; then
            echo "::notice::Déploiement ignoré : secrets absents ($manquants). L'image $APP_IMAGE est publiée sur GHCR."
            echo "pret=false" >> "$GITHUB_OUTPUT"
          else
            echo "pret=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.pret == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          sparse-checkout: docker-compose.prod.yml
          sparse-checkout-cone-mode: false

      - name: Préparer la clé SSH
        if: steps.config.outputs.pret == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploiement
          chmod 600 ~/.ssh/deploiement
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Déposer docker-compose.prod.yml
        if: steps.config.outputs.pret == 'true'
        run: |
          # Chemin interprété par le shell distant (~ compris)
          ssh -i ~/.ssh/deploiement -p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p $DEPLOY_PATH && cat > $DEPLOY_PATH/docker-compose.prod.yml" < docker-compose.prod.yml

      - name: Mettre à jour l'application
        if: steps.config.outputs.pret == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          cat > deploiement.sh <<'SCRIPT'
          set -euo pipefail
          cd "${DEPLOY_PATH/#\~/$HOME}"
          test -f .env.docker || { echo ".env.docker absent de $PWD : copiez .env.docker.example et renseignez-le" >&2; exit 1; }
          compose() { docker compose -f docker-compose.prod.yml "$@" < /dev/null; }

          # Le jeton GitHub n'est valable que pendant ce job : connexion, pull, déconnexion
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          unset GHCR_TOKEN
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          compose pull app
          compose up -d --remove-orphans

          # Healthcheck de l'image (migrations comprises)
          for i in $(seq 1 60); do
            statut=$(docker inspect -f '{{.State.Health.Status}}' "$(compose ps -q app)" 2>/dev/null || echo starting)
            [ "$statut" = "healthy" ] && break
            if [ "$statut" = "unhealthy" ] || [ "$i" = 60 ]; then
              compose logs --no-color --tail 200 app
              exit 1
            fi
            sleep 5
          done
          docker image prune -f > /dev/null
          echo "Déployé : $APP_IMAGE"
          SCRIPT

          # Le jeton passe par l'entrée standard (jamais dans la ligne de commande distante, visible dans ps) :
          # bash lit la première ligne, qui lit elle-même le jeton sur la ligne suivante.
          { echo 'read -r GHCR_TOKEN'; printf '%s\n' "$GHCR_TOKEN"; cat deploiement.sh; } \
            | ssh -i ~/.ssh/deploiement -p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
                "APP_IMAGE='$APP_IMAGE' DEPLOY_PATH='$DEPLOY_PATH' GHCR_USER='$GHCR_USER' bash -s"

      - name: Contrôle de santé public
        if: steps.config.outputs.pret == 'true' && env.DEPLOY_URL != ''
        run: |
          for _ in $(seq 1 12); do
            curl -fsS "${DEPLOY_URL%/}/up" > /dev/null && curl -fsS "${DEPLOY_URL%/}/api/v1/produits" | grep -q '"success":true' && exit 0
            sleep 5
          done
          echo "::error::$DEPLOY_URL ne répond pas correctement après le déploiement."
          exit 1

      - name: Nettoyer la clé SSH
        if: always()
        run: rm -f ~/.ssh/deploiement
