name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

# Droits minimaux : les jobs ne font que lire le dépôt.
permissions:
  contents: read

# Une seule exécution par branche : les pushes successifs annulent la précédente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.2'
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend — tests & style
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, pdo_sqlite, sqlite3, gd, bcmath, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparer l'application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Style de code (Pint)
        run: ./vendor/bin/pint --test

      - name: Tests
        run: composer test

  migrations-mysql:
    name: Backend — migrations MySQL
    runs-on: ubuntu-latest

    # Les tests tournent sur SQLite : ce job vérifie que les migrations
    # (dont le renommage d'enum en SQL brut) passent bien sur MySQL,
    # le moteur réellement utilisé en production.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: patiserie_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, pdo_mysql, gd, bcmath, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparer l'application (MySQL)
        run: |
          cp .env.example .env
          php artisan key:generate
          {
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=patiserie_ci"
            echo "DB_USERNAME=root"
            echo "DB_PASSWORD=secret"
          } >> .env

      - name: Migrer et semer
        run: php artisan migrate --force --seed

      # Vérifie que chaque down() est correct : un rollback cassé rend
      # impossible tout retour arrière en production.
      - name: Annuler puis rejouer toutes les migrations
        run: |
          php artisan migrate:reset --force
          php artisan migrate --force

  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      # Sans --fix : la CI signale les problèmes, elle ne les masque pas.
      - name: Lint (ESLint)
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Image Docker — build & scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          load: true
          tags: patiserie-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan de vulnérabilités (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: patiserie-backend:ci
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
        env:
          TRIVY_SKIP_DB_UPDATE: false
