name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

# Droits minimaux : les jobs ne font que lire le dépôt.
permissions:
  contents: read

# Une seule exécution par branche : les pushes successifs annulent la précédente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.2'
  NODE_VERSION: '22'

jobs:
  # Aucun secret dans les commits poussés (l'ancien .env.docker est resté dans
  # l'historique : ses secrets ont été révoqués, seuls les nouveaux commits sont scannés).
  secrets:
    name: Secrets — gitleaks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Commits poussés sans secret
        env:
          AVANT: ${{ github.event.before }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_PR" ]; then
            plage="$BASE_PR..HEAD"
          elif [ -n "$AVANT" ] && [ "$AVANT" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$AVANT^{commit}" 2>/dev/null; then
            plage="$AVANT..HEAD"
          else
            # Nouvelle branche : ses commits absents de master
            plage="origin/master..HEAD"
          fi
          echo "Commits analysés : $plage"
          # safe.directory : le dépôt monté appartient à l'utilisateur du runner, pas à celui de l'image
          docker run --rm -v "$PWD:/repo" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --log-opts="$plage" --redact --verbose .

  backend:
    name: Backend — tests & style (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    # 8.2 : XAMPP en développement ; 8.4 : l'image Docker de production
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Installer PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite, sqlite3, gd, bcmath, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparer l'application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Style de code (Pint)
        run: ./vendor/bin/pint --test

      # Paquets PHP embarqués dans l'image : aucun avis de sécurité connu
      - name: Audit des dépendances (Composer)
        run: composer audit --no-dev

      - name: Tests
        run: composer test

  migrations-mysql:
    name: Backend — migrations MySQL
    runs-on: ubuntu-latest

    # Les tests tournent sur SQLite : ce job vérifie que les migrations
    # (dont le renommage d'enum en SQL brut) passent bien sur MySQL,
    # le moteur réellement utilisé en production.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: patiserie_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Installer PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, pdo_mysql, gd, bcmath, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparer l'application (MySQL)
        run: |
          cp .env.example .env
          php artisan key:generate
          {
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=patiserie_ci"
            echo "DB_USERNAME=root"
            echo "DB_PASSWORD=secret"
          } >> .env

      - name: Migrer et semer
        run: php artisan migrate --force --seed

      # Vérifie que chaque down() est correct : un rollback cassé rend
      # impossible tout retour arrière en production.
      - name: Annuler puis rejouer toutes les migrations
        run: |
          php artisan migrate:reset --force
          php artisan migrate --force

  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Installer Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      # Trivy ne voit que le SPA compilé : les paquets npm livrés au navigateur sont audités ici
      - name: Audit des dépendances (npm)
        run: npm audit --omit=dev --audit-level=high

      # Sans --fix : la CI signale les problèmes, elle ne les masque pas.
      - name: Lint (ESLint)
        run: npm run lint

      - name: Tests des utilitaires (node --test)
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Image Docker — build, scan & smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurer Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Construire l'image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: patiserie-choukran:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Bloque sur toute faille HIGH/CRITICAL déjà corrigée en amont : un échec sans
      # changement de code signifie qu'une nouvelle faille a été publiée (mettre à jour
      # les paquets Composer concernés ; l'image fait déjà apk upgrade).
      - name: Scan de vulnérabilités (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Miroirs de la base de vulnérabilités : ghcr.io seul limite souvent les téléchargements
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
        with:
          image-ref: patiserie-choukran:latest
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Préparer l'environnement de test
        run: |
          cp .env.docker.example .env.docker
          {
            echo "MYSQL_PASSWORD=ci_password"
            echo "MYSQL_ROOT_PASSWORD=ci_root_password"
            echo "DB_PASSWORD=ci_password"
            echo "APP_KEY=base64:$(openssl rand -base64 32)"
          } >> .env.docker

      - name: Démarrer la pile
        env:
          RUN_SEEDERS: 'true'
        run: docker compose up -d --no-build

      - name: Attendre que l'application soit saine
        run: |
          for _ in $(seq 1 60); do
            statut=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q app)" 2>/dev/null || echo starting)
            [ "$statut" = "healthy" ] && exit 0
            [ "$statut" = "unhealthy" ] && break
            sleep 5
          done
          echo "::error::L'application n'est jamais devenue saine."
          docker compose logs --no-color app
          exit 1

      # Prouve la correction G5 : sans le middleware « stateful » de Sanctum,
      # un POST portant un en-tête Origin n'est plus rejeté en 419.
      - name: Smoke test
        run: |
          set -euo pipefail
          base=http://localhost:8088

          echo "→ SPA"
          curl -fsS "$base/" | grep -q '<div id="app"'

          # nginx n'hérite pas des add_header du bloc server : chaque type de réponse est vérifié
          echo "→ en-têtes de sécurité (page du SPA, route du routeur, fichier statique, API)"
          script=$(curl -fsS "$base/" | grep -o 'src="/assets/[^"]*\.js"' | head -n 1 | cut -d'"' -f2)
          for chemin in / /produits "$script" /api/v1/produits; do
            entetes=$(curl -fsS -o /dev/null -D - "$base$chemin")
            echo "$entetes" | grep -qi '^content-security-policy:' || { echo "::error::CSP absente sur $chemin"; exit 1; }
            echo "$entetes" | grep -qi '^x-content-type-options: *nosniff' || { echo "::error::nosniff absent sur $chemin"; exit 1; }
          done

          echo "→ /up"
          curl -fsS "$base/up" > /dev/null

          echo "→ catalogue public"
          curl -fsS "$base/api/v1/produits" | grep -q '"success":true'

          echo "→ connexion (avec en-tête Origin)"
          jeton=$(curl -fsS -X POST "$base/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -H "Origin: $base" \
            -d '{"telephone":"+237699000003","mot_de_passe":"password123"}' \
            | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          test -n "$jeton"

          echo "→ route authentifiée"
          curl -fsS "$base/api/v1/panier" -H "Authorization: Bearer $jeton" \
            -H 'Accept: application/json' | grep -q '"success":true'

          echo "→ worker et planificateur en cours d'exécution"
          docker compose exec -T app sh -c 'pgrep -f "queue:work" >/dev/null && pgrep -f "schedule:work" >/dev/null'

      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --no-color

      - name: Arrêter la pile
        if: always()
        run: docker compose down -v
