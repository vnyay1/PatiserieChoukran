name: Docker Build

on:
  push:
    branches: ["master"]
    paths:
      - "docker-compose.yml"
      - ".env.docker"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "docker-compose.yml"
      - ".env.docker"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/docker-build.yml"

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-validate:
    name: Validate Compose
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose --env-file .env.docker config

  build-images:
    name: Build Images
    runs-on: ubuntu-latest
    needs: compose-validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: backend-app
            context: backend
            dockerfile: Dockerfile
            target: app
          - image_name: backend-web
            context: backend
            dockerfile: Dockerfile
            target: web
          - image_name: frontend
            context: frontend
            dockerfile: Dockerfile
            target: runtime

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image_name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          tags: local/${{ matrix.image_name }}:ci
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan ${{ matrix.image_name }} with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: local/${{ matrix.image_name }}:ci
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  smoke-test:
    name: Compose Smoke Test
    runs-on: ubuntu-latest
    needs: build-images

    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose --env-file .env.docker up -d --build

      - name: Wait for services
        run: |
          set -euo pipefail

          wait_for_service() {
            local service="$1"
            local expected="$2"
            local attempts="${3:-45}"
            local sleep_seconds="${4:-4}"

            echo "Waiting for $service ($expected)..."
            for i in $(seq 1 "$attempts"); do
              cid="$(docker compose --env-file .env.docker ps -q "$service")"
              if [ -z "$cid" ]; then
                sleep "$sleep_seconds"
                continue
              fi

              status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$cid")"
              echo "Attempt $i/$attempts: $service status=$status"

              if [ "$status" = "$expected" ]; then
                return 0
              fi

              sleep "$sleep_seconds"
            done

            echo "$service did not reach expected status: $expected"
            return 1
          }

          wait_for_service db healthy 30 3
          wait_for_service backend-web healthy 45 4
          wait_for_service frontend healthy 45 4
          wait_for_service phpmyadmin running 30 3

      - name: Endpoint checks
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8000/up > /dev/null
          curl -fsS http://localhost:5173 > /dev/null
          curl -fsS http://localhost:8081 > /dev/null

      - name: Compose logs on failure
        if: failure()
        run: docker compose --env-file .env.docker logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose --env-file .env.docker down -v --remove-orphans
