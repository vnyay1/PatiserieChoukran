# Pile de production : même architecture que docker-compose.yml, mais l'application
# vient de l'image publiée sur GHCR par le workflow CD (aucun build sur le serveur).
#
# Sur le serveur, dans le dossier de déploiement (DEPLOY_PATH) :
#   .env.docker                 secrets (copié à la main depuis .env.docker.example)
#   docker-compose.prod.yml     déposé par le workflow CD à chaque déploiement
#
# Déploiement manuel d'une version :
#   APP_IMAGE=ghcr.io/<propriétaire>/<dépôt>:sha-abc1234 docker compose -f docker-compose.prod.yml up -d
#
# phpMyAdmin n'est démarré qu'à la demande et n'écoute que sur le serveur lui-même
# (tunnel SSH : ssh -L 8081:127.0.0.1:8081 serveur) :
#   docker compose -f docker-compose.prod.yml --profile admin up -d phpmyadmin

services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE doit désigner l'image à déployer}
    env_file:
      - ./.env.docker
    environment:
      RUN_MIGRATIONS: "true"
      RUN_SEEDERS: "false"
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_net

  db:
    image: mysql:8.4
    env_file:
      - ./.env.docker
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped
    networks:
      - app_net

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    profiles: ["admin"]
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_net

volumes:
  mysql_data:
  app_storage:

networks:
  app_net:
    driver: bridge
