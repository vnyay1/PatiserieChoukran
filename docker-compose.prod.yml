# Pile de production : même architecture que docker-compose.yml, mais l'application
# vient de l'image publiée sur GHCR par le workflow CD (aucun build sur le serveur).
#
# Sur le serveur, dans le dossier de déploiement (DEPLOY_PATH) :
#   .env.docker                 secrets (copié à la main depuis .env.docker.example),
#                               avec DOMAINE (nom de domaine public) et TRUSTED_PROXIES=*
#   docker-compose.prod.yml     déposé par le workflow CD à chaque déploiement
#   docker/caddy/Caddyfile      idem
#
# HTTPS : Caddy est le seul service exposé (80 et 443) et obtient le certificat de
# DOMAINE ; l'application n'est joignable qu'à travers lui.
#
# Déploiement manuel d'une version (DOMAINE sert aussi à l'interpolation ci-dessous) :
#   DOMAINE=choukrane.cm APP_IMAGE=ghcr.io/<propriétaire>/<dépôt>:sha-abc1234 docker compose -f docker-compose.prod.yml up -d
#
# phpMyAdmin n'est démarré qu'à la demande et n'écoute que sur le serveur lui-même
# (tunnel SSH : ssh -L 8081:127.0.0.1:8081 serveur) :
#   docker compose -f docker-compose.prod.yml --profile admin up -d phpmyadmin

services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE doit désigner l'image à déployer}
    env_file:
      - ./.env.docker
    environment:
      RUN_MIGRATIONS: "true"
      RUN_SEEDERS: "false"
    # Pas de port publié : seul Caddy, sur le réseau app_net, joint l'application
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_net

  db:
    image: mysql:8.4
    env_file:
      - ./.env.docker
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped
    networks:
      - app_net

  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    environment:
      # Seule variable passée à Caddy (pas tout .env.docker et ses secrets)
      DOMAINE: ${DOMAINE:?DOMAINE doit désigner le domaine public (certificat HTTPS)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_net

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    profiles: ["admin"]
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_net

volumes:
  mysql_data:
  app_storage:
  # Certificats et clés de Caddy : à conserver (limite de délivrance de Let's Encrypt)
  caddy_data:
  caddy_config:

networks:
  app_net:
    driver: bridge
