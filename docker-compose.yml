# Pile complète en trois conteneurs.
#
#   app         image unique : nginx + php-fpm + file d'attente + planificateur + SPA
#   db          MySQL 8.4
#   phpmyadmin  administration de la base
#
# Démarrage :
#   cp .env.docker.example .env.docker   (puis renseigner les mots de passe)
#   docker compose up -d --build
#
# L'application est alors sur http://localhost:8088 — SPA et API sur le même
# port, donc aucune configuration de CORS n'est nécessaire.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    image: patiserie-choukran:latest
    env_file:
      - ./.env.docker
    environment:
      # Les migrations sont jouées à chaque démarrage (sans effet si à jour).
      RUN_MIGRATIONS: "true"
      # Passer à "true" une seule fois pour insérer les données de démonstration.
      RUN_SEEDERS: "${RUN_SEEDERS:-false}"
    ports:
      - "${APP_PORT:-8088}:80"
    volumes:
      # Fichiers téléversés, journaux et clé générée : conservés entre les
      # reconstructions d'image.
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_net

  db:
    image: mysql:8.4
    env_file:
      - ./.env.docker
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    # Port non publié : évite tout conflit avec le MySQL de XAMPP.
    # Décommenter pour se connecter depuis l'hôte sur le port 3307.
    # ports:
    #   - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped
    networks:
      - app_net

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    # Aucun identifiant prérempli : on se connecte avec ceux de .env.docker.
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_net

volumes:
  mysql_data:
  app_storage:

networks:
  app_net:
    driver: bridge
