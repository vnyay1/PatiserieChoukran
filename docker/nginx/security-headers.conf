# En-têtes de sécurité de toutes les réponses.
# nginx n'hérite des add_header du bloc server que dans les location qui n'en
# définissent aucun : ce fichier est inclus dans le bloc server ET dans chaque
# location qui ajoute son propre en-tête (sinon la page du SPA en était privée).
#
# CSP : scripts, styles, polices et appels d'API uniquement depuis l'origine du site
# (polices auto-hébergées, script de thème dans /theme-init.js). Les styles inline
# restent permis pour les liaisons :style de Vue. HSTS est posé par Caddy en production.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
