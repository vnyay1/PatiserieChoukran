# Un seul port pour le SPA et l'API : le SPA est servi à la racine, Laravel
# répond sur /api, /up et /storage. Même origine, donc ni CORS ni cookies tiers.
server {
    listen 80 default_server;
    server_name _;
    charset utf-8;

    root /var/www/spa;
    index index.html;

    # CSP et autres en-têtes : voir security-headers.conf (repris dans chaque location
    # qui définit son propre add_header, sinon ils seraient perdus)
    include /etc/nginx/snippets/security-headers.conf;

    # --- Laravel -----------------------------------------------------------
    location ^~ /api/ {
        try_files $uri @laravel;
    }

    # Sonde de santé de Laravel (utilisée par le HEALTHCHECK de l'image).
    location = /up {
        try_files $uri @laravel;
    }

    # Fichiers téléversés : public/storage est un lien vers storage/app/public.
    location ^~ /storage/ {
        root /var/www/html/public;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;

        # Le préfixe ^~ court-circuite la règle des fichiers cachés plus bas : on la répète
        location ~ /\. {
            deny all;
        }
    }

    location @laravel {
        include fastcgi_params;
        # httpoxy : un en-tête « Proxy: » ne doit pas devenir la variable HTTP_PROXY de PHP
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # --- SPA ---------------------------------------------------------------
    # Les noms de fichiers produits par Vite contiennent un hachage :
    # ils peuvent être mis en cache indéfiniment.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # Manifeste de l'application : extension absente de mime.types (servie sinon en
    # application/octet-stream, refusée avec nosniff). Pas d'add_header ici : les en-têtes
    # de sécurité du bloc server s'appliquent.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Toute autre URL est une route du routeur Vue.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Aucun fichier PHP n'est servi directement : tout passe par @laravel.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
