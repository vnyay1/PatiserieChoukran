# Un seul port pour le SPA et l'API : le SPA est servi à la racine, Laravel
# répond sur /api, /up et /storage. Même origine, donc ni CORS ni cookies tiers.
server {
    listen 80 default_server;
    server_name _;
    charset utf-8;

    root /var/www/spa;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Laravel -----------------------------------------------------------
    location ^~ /api/ {
        try_files $uri @laravel;
    }

    # Sonde de santé de Laravel (utilisée par le HEALTHCHECK de l'image).
    location = /up {
        try_files $uri @laravel;
    }

    # Fichiers téléversés : public/storage est un lien vers storage/app/public.
    location ^~ /storage/ {
        root /var/www/html/public;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location @laravel {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # --- SPA ---------------------------------------------------------------
    # Les noms de fichiers produits par Vite contiennent un hachage :
    # ils peuvent être mis en cache indéfiniment.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Toute autre URL est une route du routeur Vue.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Aucun fichier PHP n'est servi directement : tout passe par @laravel.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
