[www]
user = www-data
group = www-data

; nginx tourne dans le même conteneur : inutile d'exposer le port 9000.
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Les variables d'environnement de Compose doivent atteindre Laravel.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no

ping.path = /ping
pm.status_path = /status
