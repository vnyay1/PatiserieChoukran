<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Couleur de la barre du navigateur : suit le thème choisi (theme-init.js, stores/theme.js) -->
    <meta name="theme-color" content="#FFFFFF" />
    <meta
      name="description"
      content="Choukrane Pâtisserie : pâtisseries, gâteaux et glaces livrés à Yaoundé et Douala. Paiement Orange Money, MTN MoMo ou à la livraison."
    />
    <title>Choukrane Pâtisserie : gâteaux et glaces livrés à Yaoundé et Douala</title>

    <!-- Icônes (vrais PNG tirés du logo) et application installable -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Partage (WhatsApp, Facebook…). %URL_PUBLIQUE% : VITE_URL_PUBLIQUE au build (vite.config.js),
         vide par défaut : l'image reste alors une adresse relative -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Choukrane Pâtisserie" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Choukrane Pâtisserie : gâteaux et glaces livrés à Yaoundé et Douala" />
    <meta
      property="og:description"
      content="Les créations de nos pâtissiers, livrées chez vous ou à retirer en boutique. Paiement Orange Money, MTN MoMo ou à la livraison."
    />
    <meta property="og:image" content="%URL_PUBLIQUE%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo Choukrane Pâtisserie : gâteaux, pâtisseries et glaces livrés à Yaoundé et Douala" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Thème appliqué avant le premier rendu (pas de flash blanc en mode sombre) : script
         synchrone du site, compatible avec la CSP (aucun script inline). Polices : src/main.js -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      Cette application nécessite JavaScript. Veuillez l'activer dans votre navigateur.
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
